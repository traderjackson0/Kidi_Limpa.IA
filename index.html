<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYORE.IA - Painel de Controlo</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-primary: #0a0d14;
            --bg-secondary: #121824;
            --bg-card: #1a2234;
            --accent-blue: #0088ff;
            --accent-cyan: #00d2ff;
            --accent-green: #00e676;
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
            --border-color: #243047;
            --sidebar-width: 260px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- TELA DE LOGIN / AUTENTICAÇÃO --- */
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-primary);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .auth-title {
            color: var(--accent-cyan);
            font-size: 1.5rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .auth-subtitle {
            color: var(--text-muted);
            font-size: 0.88rem;
            margin-bottom: 24px;
        }

        .pin-inputs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .pin-digit {
            width: 48px;
            height: 56px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--accent-cyan);
            font-size: 1.5rem;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        .pin-digit:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 8px rgba(0, 136, 255, 0.4);
        }

        .btn-auth {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-blue), #0055ff);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-auth:hover { opacity: 0.9; }

        /* --- ESTRUTURA PRINCIPAL (SIDEBAR + CONTEÚDO) --- */
        #app-container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        sidebar {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent-cyan);
            font-size: 1.2rem;
            font-weight: bold;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.2s;
            text-align: left;
        }

        .nav-btn:hover, .nav-btn.active {
            background: var(--bg-card);
            color: var(--accent-cyan);
        }

        .history-section {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .history-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .history-item {
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-main);
            background: var(--bg-primary);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 1px solid transparent;
        }

        .history-item:hover { border-color: var(--border-color); }

        .btn-logout {
            margin-top: auto;
            background: rgba(255, 65, 108, 0.1);
            color: #ff416c;
            border: 1px solid rgba(255, 65, 108, 0.2);
        }

        .btn-logout:hover {
            background: rgba(255, 65, 108, 0.2);
            color: #ff416c;
        }

        /* --- ÁREA PRINCIPAL --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            position: relative;
        }

        header {
            height: 60px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: var(--bg-secondary);
        }

        .view-panel {
            display: none;
            flex: 1;
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        .view-panel.active { display: flex; flex-direction: column; }

        /* --- VIEW: CHAT --- */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .user-msg {
            align-self: flex-end;
            background: var(--accent-blue);
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .bot-msg {
            align-self: flex-start;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-bottom-left-radius: 2px;
        }

        .input-bar {
            padding: 16px 24px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
        }

        .input-bar input {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            color: white;
            outline: none;
        }

        .input-bar button {
            padding: 0 20px;
            background: var(--accent-blue);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        /* --- VIEW: CALCULADORA --- */
        .calc-wrapper {
            margin: auto;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 16px;
            width: 300px;
        }

        .calc-display {
            width: 100%;
            height: 50px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--accent-cyan);
            font-size: 1.5rem;
            text-align: right;
            padding: 10px;
            margin-bottom: 16px;
            outline: none;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .calc-btn {
            padding: 15px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .calc-btn:hover { background: var(--border-color); }
        .calc-btn.op { color: var(--accent-cyan); }
    </style>
</head>
<body>

    <!-- OVERLAY DE AUTENTICAÇÃO -->
    <div id="auth-overlay">
        <div class="auth-card">
            <div class="auth-title">
                <i data-lucide="shield-lock"></i>
                NYORE.IA
            </div>
            <div id="auth-subtitle" class="auth-subtitle">Define um PIN de 4 dígitos para registar</div>
            
            <div class="pin-inputs">
                <input type="password" maxlength="1" class="pin-digit" autofocus>
                <input type="password" maxlength="1" class="pin-digit">
                <input type="password" maxlength="1" class="pin-digit">
                <input type="password" maxlength="1" class="pin-digit">
            </div>

            <button class="btn-auth" onclick="autenticar()">ENTRAR</button>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL -->
    <div id="app-container">
        <!-- SIDEBAR -->
        <sidebar>
            <div class="brand">
                <i data-lucide="bot"></i> NYORE.IA
            </div>

            <div class="nav-menu">
                <button class="nav-btn active" onclick="mudarAba('chat', this)">
                    <i data-lucide="message-square"></i> Conversa Principal
                </button>
                <button class="nav-btn" onclick="mudarAba('calc', this)">
                    <i data-lucide="calculator"></i> Calculadora
                </button>
            </div>

            <div class="history-section">
                <div class="history-title">Histórico de Sessões</div>
                <div id="history-list"></div>
            </div>

            <button class="nav-btn btn-logout" onclick="bloquearPainel()">
                <i data-lucide="lock"></i> Bloquear / Sair
            </button>
        </sidebar>

        <!-- MAIN CONTENT -->
        <main>
            <header>
                <div id="header-status" style="color: var(--accent-cyan); font-weight: bold;">
                    ● Sistema Operacional
                </div>
                <div id="user-display" style="font-size: 0.9rem; color: var(--text-muted);">
                    Sessão Protegida
                </div>
            </header>

            <!-- VIEW: CHAT -->
            <div id="view-chat" class="view-panel active">
                <div id="chat-container">
                    <div class="msg bot-msg">
                        Sistemas operacionais, Chefão! Base de dados e cérebro humanizado prontos. Em que vamos trabalhar hoje?
                    </div>
                </div>
                <div class="input-bar">
                    <input type="text" id="chatInput" placeholder="Digita a tua mensagem..." onkeypress="handleKey(event)">
                    <button onclick="enviar()">ENVIAR</button>
                </div>
            </div>

            <!-- VIEW: CALCULADORA -->
            <div id="view-calc" class="view-panel">
                <div class="calc-wrapper">
                    <input type="text" id="calcDisplay" class="calc-display" readonly>
                    <div class="calc-grid">
                        <button class="calc-btn" onclick="calcClear()">C</button>
                        <button class="calc-btn op" onclick="calcAppend('/')">/</button>
                        <button class="calc-btn op" onclick="calcAppend('*')">*</button>
                        <button class="calc-btn op" onclick="calcAppend('-')">-</button>
                        <button class="calc-btn" onclick="calcAppend('7')">7</button>
                        <button class="calc-btn" onclick="calcAppend('8')">8</button>
                        <button class="calc-btn" onclick="calcAppend('9')">9</button>
                        <button class="calc-btn op" onclick="calcAppend('+')">+</button>
                        <button class="calc-btn" onclick="calcAppend('4')">4</button>
                        <button class="calc-btn" onclick="calcAppend('5')">5</button>
                        <button class="calc-btn" onclick="calcAppend('6')">6</button>
                        <button class="calc-btn op" onclick="calcEval()">=</button>
                        <button class="calc-btn" onclick="calcAppend('1')">1</button>
                        <button class="calc-btn" onclick="calcAppend('2')">2</button>
                        <button class="calc-btn" onclick="calcAppend('3')">3</button>
                        <button class="calc-btn" onclick="calcAppend('0')">0</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        /* =========================================================
           1. CÉREBRO HUMANIZADO, MEMÓRIA & INTERVENÇÃO INTEGRAIS
           ========================================================= */
        class CerebroNyore {
            constructor() {
                this.prefixoMemoria = "nyore_brain_";
                this.prefixoBibliotecas = "nyore_lib_";
            }

            guardar(chave, valor) {
                localStorage.setItem(this.prefixoMemoria + chave.toLowerCase(), JSON.stringify(valor));
            }

            buscar(chave) {
                const dado = localStorage.getItem(this.prefixoMemoria + chave.toLowerCase());
                return dado ? JSON.parse(dado) : null;
            }

            obterSaudacaoHorario() {
                const hora = new Date().getHours();
                if (hora >= 5 && hora < 12) return "Bom dia";
                if (hora >= 12 && hora < 18) return "Boa tarde";
                return "Boa noite";
            }

            sortear(lista) {
                return lista[Math.floor(Math.random() * lista.length)];
            }

            deveIntervir(texto) {
                const t = texto.toLowerCase().trim();
                const gatilhos = ["nyore", "ia", "bot", "chefão", "assistente"];
                const eMencionada = gatilhos.some(g => t.includes(g));
                const ePergunta = t.endsWith("?") || ["como", "o que", "explica", "ajuda"].some(p => t.includes(p));
                return eMencionada || ePergunta;
            }

            aprenderTextoLivre(texto) {
                const libs = ["sqlite3", "kivy", "requests", "csharp", "python", "javascript", "sqlserver"];
                let encontradas = [];
                const t = texto.toLowerCase();

                libs.forEach(lib => {
                    if (t.includes(lib)) {
                        this.salvarBiblioteca(lib, texto);
                        encontradas.push(lib.toUpperCase());
                    }
                });

                if (encontradas.length > 0) {
                    return `Conhecimento absorvido sobre: **${encontradas.join(", ")}**!`;
                }
                this.guardar("aprendizado_" + Date.now(), texto);
                return "Informação capturada na memória!";
            }

            salvarBiblioteca(lib, conteudo) {
                const chave = this.prefixoBibliotecas + lib;
                let dados = JSON.parse(localStorage.getItem(chave)) || [];
                dados.push({ conteudo, data: new Date().toLocaleDateString("pt-PT") });
                localStorage.setItem(chave, JSON.stringify(dados));
            }

            processar(texto) {
                if (!texto.trim()) return null;

                if (!this.deveIntervir(texto)) {
                    this.aprenderTextoLivre(texto);
                    return null; // Silêncio se não for chamada
                }

                const t = texto.toLowerCase();
                const nome = this.buscar("nome_usuario") || "Chefão";
                const saudacao = this.obterSaudacaoHorario();

                if (t.includes("meu nome é") || t.includes("sou o")) {
                    const extraido = t.replace(/(meu nome é|sou o)/g, "").trim();
                    this.guardar("nome_usuario", extraido);
                    return `Entendido! Registo atualizado, Chefão ${extraido}.`;
                }

                if (t.includes("obrigado") || t.includes("valeu")) {
                    return this.sortear([
                        `Tamo junto, ${nome}!`,
                        `Sempre às ordens, Chefão!`,
                        `Sem problemas! Conta comigo.`
                    ]);
                }

                return `${saudacao}, ${nome}! Processando a tua solicitação. Como posso ajudar a avançar?`;
            }
        }

        const cerebro = new CerebroNyore();

        /* =========================================================
           2. AUTENTICAÇÃO PIN 4 DÍGITOS
           ========================================================= */
        const pinInputs = document.querySelectorAll('.pin-digit');
        
        pinInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < pinInputs.length - 1) {
                    pinInputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    pinInputs[index - 1].focus();
                }
            });
        });

        function verificarPin() {
            let pin = "";
            pinInputs.forEach(i => pin += i.value);
            return pin;
        }

        function autenticar() {
            const pinDigitado = verificarPin();
            if (pinDigitado.length !== 4) {
                alert("Por favor, preenche os 4 dígitos do PIN.");
                return;
            }

            const pinSalvo = localStorage.getItem("nyore_user_pin");

            if (!pinSalvo) {
                localStorage.setItem("nyore_user_pin", pinDigitado);
                alert("PIN criado com sucesso!");
                desbloquearPainel();
            } else if (pinSalvo === pinDigitado) {
                desbloquearPainel();
            } else {
                alert("PIN Incorreto! Tenta novamente.");
                pinInputs.forEach(i => i.value = "");
                pinInputs[0].focus();
            }
        }

        function desbloquearPainel() {
            document.getElementById("auth-overlay").style.display = "none";
        }

        function bloquearPainel() {
            pinInputs.forEach(i => i.value = "");
            document.getElementById("auth-overlay").style.display = "flex";
            pinInputs[0].focus();
        }

        // Verifica o PIN ao carregar a página
        window.onload = () => {
            lucide.createIcons();
            const pinSalvo = localStorage.getItem("nyore_user_pin");
            if (p
