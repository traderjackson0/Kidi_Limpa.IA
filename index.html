<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NYORE.IA</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-primary: #090c10;
            --bg-secondary: #131924;
            --bg-card: #1c2536;
            --accent-blue: #0088ff;
            --accent-cyan: #00d2ff;
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
            --border-color: #243047;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: var(--bg-primary);
            color: var(--text-main);
            overflow: hidden;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
        }

        header {
            height: 56px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
        }

        .brand-title {
            color: var(--accent-cyan);
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        sidebar {
            position: absolute;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
            transition: left 0.3s ease-in-out;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }

        sidebar.open { left: 0; }

        .overlay-menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 90;
            display: none;
        }

        .overlay-menu.active { display: block; }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: left;
        }

        .nav-btn.active, .nav-btn:hover {
            background: var(--bg-card);
            color: var(--accent-cyan);
        }

        .history-section {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .history-item {
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-main);
            background: var(--bg-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 1px solid var(--border-color);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: calc(100% - 56px);
            position: relative;
        }

        .view-panel {
            display: none;
            flex: 1;
            height: 100%;
            overflow: hidden;
        }

        .view-panel.active {
            display: flex;
            flex-direction: column;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user-msg {
            align-self: flex-end;
            background: var(--accent-blue);
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .bot-msg {
            align-self: flex-start;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-bottom-left-radius: 2px;
        }

        .input-bar {
            padding: 10px 12px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-bar input {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 10px 16px;
            color: white;
            outline: none;
            font-size: 0.95rem;
        }

        .input-bar button {
            padding: 10px 16px;
            background: var(--accent-blue);
            border: none;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .calc-wrapper {
            margin: auto;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 16px;
            width: 90%;
            max-width: 320px;
        }

        .calc-display {
            width: 100%;
            height: 48px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--accent-cyan);
            font-size: 1.4rem;
            text-align: right;
            padding: 8px;
            margin-bottom: 12px;
            outline: none;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .calc-btn {
            padding: 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }

        .calc-btn.op { color: var(--accent-cyan); }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="overlayMenu" class="overlay-menu" onclick="toggleMenu()"></div>

        <header>
            <div class="header-left">
                <button class="menu-btn" onclick="toggleMenu()">
                    <i data-lucide="menu"></i>
                </button>
                <div class="brand-title">
                    <i data-lucide="bot"></i> NYORE.IA
                </div>
            </div>
            <div style="font-size: 0.8rem; color: var(--accent-cyan);">● Ativa</div>
        </header>

        <sidebar id="sideMenu">
            <div class="brand-title" style="padding-bottom: 10px; border-bottom: 1px solid var(--border-color);">
                <i data-lucide="bot"></i> Painel Nyore
            </div>

            <div class="nav-menu">
                <button class="nav-btn active" onclick="mudarAba('chat', this)">
                    <i data-lucide="message-square"></i> Chat Principal
                </button>
                <button class="nav-btn" onclick="mudarAba('calc', this)">
                    <i data-lucide="calculator"></i> Calculadora
                </button>
            </div>

            <div class="history-section">
                <div class="history-title">Histórico Recente</div>
                <div id="history-list"></div>
            </div>

            <button class="nav-btn" style="color: var(--accent-blue);" onclick="novaConversa()">
                <i data-lucide="plus-circle"></i> Nova Conversa
            </button>
        </sidebar>

        <main>
            <div id="view-chat" class="view-panel active">
                <div id="chat-container">
                    <div class="msg bot-msg">
                        Sistemas operacionais, Chefão! Mente atualizada e sem bugs. Podes ensinar-me conceitos ou mapear respostas diretas!
                    </div>
                </div>
                <div class="input-bar">
                    <input type="text" id="chatInput" placeholder="Digita a tua mensagem..." onkeypress="handleKey(event)">
                    <button onclick="enviar()">ENVIAR</button>
                </div>
            </div>

            <div id="view-calc" class="view-panel">
                <div class="calc-wrapper">
                    <input type="text" id="calcDisplay" class="calc-display" readonly>
                    <div class="calc-grid">
                        <button class="calc-btn" onclick="calcClear()">C</button>
                        <button class="calc-btn op" onclick="calcAppend('/')">/</button>
                        <button class="calc-btn op" onclick="calcAppend('*')">*</button>
                        <button class="calc-btn op" onclick="calcAppend('-')">-</button>
                        <button class="calc-btn" onclick="calcAppend('7')">7</button>
                        <button class="calc-btn" onclick="calcAppend('8')">8</button>
                        <button class="calc-btn" onclick="calcAppend('9')">9</button>
                        <button class="calc-btn op" onclick="calcAppend('+')">+</button>
                        <button class="calc-btn" onclick="calcAppend('4')">4</button>
                        <button class="calc-btn" onclick="calcAppend('5')">5</button>
                        <button class="calc-btn" onclick="calcAppend('6')">6</button>
                        <button class="calc-btn op" onclick="calcEval()">=</button>
                        <button class="calc-btn" onclick="calcAppend('1')">1</button>
                        <button class="calc-btn" onclick="calcAppend('2')">2</button>
                        <button class="calc-btn" onclick="calcAppend('3')">3</button>
                        <button class="calc-btn" onclick="calcAppend('0')">0</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        /* =========================================================
           CÉREBRO REPARADO & UNIFICADO DA NYORE.IA
           ========================================================= */
        class CerebroNyore {
            constructor() {
                this.prefixoTopico = "nyore_topico_";
                this.prefixoPerguntDirect = "nyore_qa_";
            }

            // Normalização inteligente: Remove aspas, pontuações estranhas e acentos
            limpar(str) {
                if (!str) return "";
                return str.toLowerCase()
                          .normalize("NFD")
                          .replace(/[\u0300-\u036f]/g, "")
                          .replace(/["'*`*_]/g, "")
                          .trim();
            }

            // 1. Guardar Tópico Geral
            salvarTopico(topico, conteudo) {
                const chave = this.limpar(topico);
                if (!chave) return "Não consegui entender o tópico, Chefão.";
                localStorage.setItem(this.prefixoTopico + chave, conteudo);
                return `Entendido, Chefão! Guardei na memória tudo sobre **${topico.toUpperCase().trim()}**.`;
            }

            // 2. NOVO MÉTODO: Mapear Pergunta para Resposta Direta
            salvarPerguntaResposta(pergunta, resposta) {
                const chave = this.limpar(pergunta);
                if (!chave) return "Não entendi a pergunta, Chefão.";
                localStorage.setItem(this.prefixoPerguntDirect + chave, resposta);
                return `Mapeamento concluído, Chefão! Quando me perguntares *"${pergunta.trim()}"*, vou responder exatamente: **"${resposta.trim()}"**.`;
            }

            // Buscar Tópico
            buscarTopico(termo) {
                const chave = this.limpar(termo);
                return localStorage.getItem(this.prefixoTopico + chave);
            }

            // Buscar Pergunta Direta
            buscarPerguntaDireta(pergunta) {
                const chave = this.limpar(pergunta);
                return localStorage.getItem(this.prefixoPerguntDirect + chave);
            }

            // Processador Principal da IA
            processar(textoOriginal) {
                if (!textoOriginal || !textoOriginal.trim()) return null;

                const raw = textoOriginal.trim();
                const t = this.limpar(raw);

                // --- A. NOVO MÉTODO DE ENSINO: "Quando eu perguntar [P], responde [R]" ---
                if (t.includes("quando eu perguntar") || t.includes("se eu perguntar")) {
                    let partes = raw.split(/responde|responda/i);
                    if (partes.length >= 2) {
                        let pergunta = partes[0].replace(/(nyore|quando eu perguntar|se eu perguntar|que|para)/gi, "").replace(/["',]/g, "").trim();
                        let resposta = partes.slice(1).join("responde").replace(/["']/g, "").trim();
                        return this.salvarPerguntaResposta(pergunta, resposta);
                    }
                }

                // --- B. MÉTODO ANTIGO DE ENSINO: "Nyore, aprende que [Tópico]: [Conteúdo]" ---
                if (t.includes("aprende") || t.includes("guarda isto") || t.includes("aprende isto")) {
                    let partes = raw.split(":");
                    if (partes.length >= 2) {
                        let topico = partes[0].replace(/(nyore|aprende|isto|que|aprenda)/gi, "").trim();
                        let conteudo = partes.slice(1).join(":").trim();
                        return this.salvarTopico(topico, conteudo);
                    } else {
                        // Se colou frase corrida sem dois pontos (ex: "Nyore aprende que Angola é um país...")
                        let extraido = raw.replace(/(nyore|aprende|isto|que|aprenda)/gi, "").trim();
                        let palavras = extraido.split(" ");
                        let topico = palavras[0]; // Primeira palavra vira a chave
                        return this.salvarTopico(topico, extraido);
                    }
                }

                // --- C. CONSULTA MÁXIMA (Respostas Mapeadas & Perguntas Naturais) ---

                // 1. Tenta resposta direta configurada pelo usuário
                let respostaMapeada = this.buscarPerguntaDireta(t);
                if (respostaMapeada) return respostaMapeada;

                // 2. Extrai termos de perguntas comuns
                const padroesPerguntas = [
                    "oque e", "oq e", "o que e", "quem e", "quais sao", 
                    "como sao", "quando", "fala sobre", "me diz sobre", "explica sobre", "explica"
                ];

                let termoExtraido = t;
                padroesPerguntas.forEach(p => {
                    if (termoExtraido.startsWith(p)) {
                        termoExtraido = termoExtraido.replace(p, "").trim();
                    }
                });

                // Se tinha ponto de interrogação ou palavra-chave de busca
                termoExtraido = termoExtraido.replace(/(nyore|\?)/g, "").trim();

                // Busca o tópico limpo
                let resultadoMemoria = this.buscarTopico(termoExtraido);
                if (resultadoMemoria) {
                    return `📚 **Memória sobre ${termoExtraido.toUpperCase()}:**\n${resultadoMemoria}`;
                }

                // Se buscou apenas o termo solto (ex: "Angola")
                let buscaDiretaApenasTermo = this.buscarTopico(t.replace("nyore", "").trim());
                if (buscaDiretaApenasTermo) {
                    return `📚 **Memória sobre ${t.toUpperCase().replace("NYORE", "").trim()}:**\n${buscaDiretaApenasTermo}`;
                }

                // --- D. SAUDAÇÕES E DIÁLOGOS ---
                if (["ola", "oi", "viva", "tudo bem", "boas"].some(g => t.includes(g))) {
                    return "Sistemas operacionais, Chefão! Em que posso ajudar a avançar agora?";
                }

                if (t.includes("obrigado") || t.includes("valeu")) {
                    return "Tamo junto, Chefão! Sempre às ordens.";
                }

                // Fallback amigável de tópico não encontrado
                if (padroesPerguntas.some(p => t.includes(p)) || t.endsWith("?")) {
                    return `Ainda não tenho essa informação sobre **${termoExtraido || raw}** na minha base, Chefão. Podes ensinar-me dizendo: *"Nyore, aprende que ${termoExtraido || 'tópico'}: [explicação]"* ou *"Quando eu perguntar ${raw}, responde [sua resposta]"*!`;
                }

                return "Compreendido, Chefão! Acompanhando a conversa. Caso queiras que eu guarde algo, é só avisar!";
            }
        }

        const cerebro = new CerebroNyore();

        window.onload = () => { lucide.createIcons(); };

        function toggleMenu() {
            document.getElementById("sideMenu").classList.toggle("open");
            document.getElementById("overlayMenu").classList.toggle("active");
        }

        function mudarAba(aba, btn) {
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`view-${aba}`).classList.add('active');
            btn.classList.add('active');
            toggleMenu();
        }

        let historico = JSON.parse(localStorage.getItem("nyore_hist")) || [];

        function adicionarMensagem(autor, texto) {
            const container = document.getElementById("chat-container");
            const div = document.createElement("div");
            div.classList.add("msg", autor === "Tu" ? "user-msg" : "bot-msg");
            div.innerText = texto;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function enviar() {
            const input = document.getElementById("chatInput");
            const texto = input.value;
            if (!texto.trim()) return;

            adicionarMensagem("Tu", texto);
            input.value = "";

            if (historico.length === 0 || historico[0] !== texto.substring(0, 20)) {
                historico.unshift(texto.substring(0, 22) + "...");
                localStorage.setItem("nyore_hist", JSON.stringify(historico));
                renderHistorico();
            }

            const resposta = cerebro.processar(texto);
            if (resposta) {
                setTimeout(() => adicionarMensagem("Nyore", resposta), 250);
            }
        }

        function handleK
