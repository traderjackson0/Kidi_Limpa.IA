<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyore.IA — Assistente Angolana Inteligente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #120E23;
      --surface: #1B1636;
      --surface-2: #241D45;
      --lavender: #F3F0FF;
      --violet: #7C6CF6;
      --violet-soft: #5A4FD9;
      --amber: #FFB13C;
      --coral: #FF5D8F;
      --emerald: #2ECC71;
      --cyan: #3498DB;
      --muted: #9C95C4;
      --ink: #12102A;

      --display: 'Sora', sans-serif;
      --body: 'Inter', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background:
        radial-gradient(circle at 15% 0%, #221c42 0%, transparent 55%),
        radial-gradient(circle at 95% 100%, #1a1638 0%, transparent 50%),
        var(--bg-deep);
      min-height: 100vh;
      font-family: var(--body);
      padding: 24px 12px;
      color: var(--lavender);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .board {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: center;
    }

    .phone {
      width: 100%;
      height: 810px;
      background: linear-gradient(180deg, #1a1638, #120e23);
      border-radius: 40px;
      border: 8px solid #08061a;
      box-shadow:
        0 30px 70px -18px rgba(0,0,0,.8),
        0 0 0 1px rgba(124,108,246,.2);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .notch {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 120px; height: 22px;
      background: #08061a;
      border-radius: 0 0 16px 16px;
      z-index: 50;
    }

    .statusbar {
      height: 40px;
      display: flex; align-items: flex-end; justify-content: space-between;
      padding: 0 22px 6px;
      font-family: var(--mono); font-size: 11px; color: var(--lavender);
      flex-shrink: 0;
      z-index: 10;
    }

    .home-top {
      padding: 6px 22px 0;
      flex-shrink: 0;
    }
    .home-top .hello {
      font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 2px;
    }
    .home-top h2 {
      font-family: var(--display); font-weight: 600; font-size: 18px; color: var(--lavender);
    }

    /* Estágio do Orbe Dinâmico */
    .orb-stage {
      height: 170px;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      flex-shrink: 0;
    }
    .orb {
      width: 110px; height: 110px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #a89bff, var(--violet) 55%, var(--violet-soft) 100%);
      box-shadow: 0 0 50px 8px rgba(124,108,246,.4);
      position: relative;
      transition: all 0.5s ease;
      animation: breathe 3.4s ease-in-out infinite;
      cursor: pointer;
    }
    .orb::after {
      content: '';
      position: absolute; inset: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, rgba(255,255,255,.5), transparent 60%);
    }

    .orb.pesquisando {
      background: radial-gradient(circle at 35% 30%, #74b9ff, var(--cyan) 55%, #0984e3 100%);
      box-shadow: 0 0 60px 12px rgba(52, 152, 219, 0.6);
      animation: pulseFast 1.2s ease-in-out infinite;
    }
    .orb.falando {
      background: radial-gradient(circle at 35% 30%, #55efc4, var(--emerald) 55%, #00b894 100%);
      box-shadow: 0 0 60px 12px rgba(46, 204, 113, 0.6);
    }
    .orb.aprendendo {
      background: radial-gradient(circle at 35% 30%, #ffeaa7, var(--amber) 55%, #e67e22 100%);
      box-shadow: 0 0 60px 12px rgba(255, 177, 60, 0.6);
    }
    .orb.inativo {
      background: radial-gradient(circle at 35% 30%, #636e72, #2d3436 100%);
      box-shadow: none;
      animation: none;
    }

    @keyframes breathe { 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.05); } }
    @keyframes pulseFast { 0%,100%{ transform: scale(0.98); } 50%{ transform: scale(1.08); } }

    .ring { position: absolute; border-radius: 50%; border: 1px solid rgba(124,108,246,.25); }
    .ring.r1 { width: 140px; height: 140px; }
    .ring.r2 { width: 180px; height: 180px; border-color: rgba(124,108,246,.14); }

    .orb-caption {
      position: absolute; bottom: 0px; left: 0; right: 0;
      text-align: center;
    }
    .orb-caption .state { font-family: var(--display); font-weight: 600; font-size: 13px; color: var(--lavender); }
    .orb-caption .hint { font-family: var(--mono); font-size: 9.5px; color: var(--muted); }

    /* PILULA DE ESCUTA */
    .mic-pill {
      margin: 8px 16px;
      display: flex; align-items: center; gap: 10px;
      background: rgba(124,108,246,.12);
      border: 1px solid rgba(124,108,246,.3);
      border-radius: 14px;
      padding: 8px 12px;
      flex-shrink: 0;
    }
    .mic-pill .icon {
      width: 28px; height: 28px; border-radius: 8px;
      background: var(--violet);
      display: flex; align-items: center; justify-content: center;
      color: var(--ink); flex-shrink: 0;
    }
    .mic-pill .t small {
      display: block; font-family: var(--mono); font-size: 8.5px; color: var(--violet);
      text-transform: uppercase; letter-spacing: .06em;
    }
    .mic-pill .t span { font-size: 11px; font-weight: 600; color: var(--lavender); }
    .switch {
      margin-left: auto; width: 36px; height: 20px; border-radius: 10px;
      background: var(--violet); position: relative; cursor: pointer; transition: background 0.3s;
    }
    .switch::after {
      content: ''; position: absolute; top: 2px; right: 2px;
      width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform 0.3s;
    }
    .switch.desligado { background: #485460; }
    .switch.desligado::after { transform: translateX(-16px); }

    /* BOTÕES DE ATALHO */
    .home-shortcuts {
      display: flex; justify-content: center; gap: 12px;
      padding: 4px 16px 8px;
      flex-shrink: 0;
    }
    .shortcut {
      width: 44px; height: 44px; border-radius: 14px;
      background: rgba(243,240,255,.06);
      border: 1px solid rgba(243,240,255,.1);
      display: flex; align-items: center; justify-content: center;
      color: var(--lavender); cursor: pointer; transition: all 0.2s;
    }
    .shortcut:hover { background: var(--violet); color: var(--ink); transform: translateY(-2px); }

    /* CAIXA DE CHAT */
    .chat-box {
      flex: 1;
      background: rgba(11, 9, 22, 0.6);
      border-top: 1px solid rgba(243,240,255,.08);
      border-bottom: 1px solid rgba(243,240,255,.08);
      padding: 10px 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 11.5px;
      line-height: 1.4;
    }

    .msg { padding: 8px 11px; border-radius: 12px; max-width: 90%; word-wrap: break-word; }
    .msg-user { align-self: flex-end; background: var(--surface-2); border: 1px solid rgba(124,108,246,.3); color: var(--lavender); }
    .msg-ia { align-self: flex-start; background: var(--surface); border: 1px solid rgba(243,240,255,.1); color: var(--lavender); }
    .msg-sistema { align-self: center; background: rgba(255,177,60,.1); border: 1px solid rgba(255,177,60,.2); color: var(--amber); font-family: var(--mono); font-size: 9.5px; text-align: center; }

    /* ENTRADA DE TEXTO E BOTÃO ENVIAR */
    .input-section {
      padding: 8px 12px;
      background: var(--surface);
      display: flex; gap: 8px; align-items: center; flex-shrink: 0;
    }
    .input-section textarea {
      flex: 1; background: rgba(18, 14, 35, 0.8);
      border: 1px solid rgba(124,108,246,.3); border-radius: 10px;
      padding: 8px 10px; color: #fff; font-family: var(--body); font-size: 11.5px;
      outline: none; resize: none; height: 38px;
    }
    .btn-send {
      width: 38px; height: 38px; background: var(--violet); border: none;
      border-radius: 10px; color: var(--ink); display: flex; align-items: center;
      justify-content: center; cursor: pointer; flex-shrink: 0;
      transition: background 0.2s;
    }
    .btn-send:active {
      transform: scale(0.95);
    }

    .mem-footer {
      padding: 6px 14px 10px; background: var(--bg-deep);
      font-family: var(--mono); font-size: 8.5px; color: var(--muted);
      display: flex; justify-content: space-between; flex-shrink: 0;
    }
  </style>
</head>
<body>

<div class="board">
  <div class="phone">
    <div class="notch"></div>
    <div class="statusbar">
      <span id="relogio">00:00</span>
      <span>NYORE.IA</span>
      <span>100%</span>
    </div>

    <div class="home-top">
      <div class="hello" id="saudacao">Boa noite</div>
      <h2 id="tituloPrincipal">Diz, estou a ouvir.</h2>
    </div>

    <!-- Orbe Visual -->
    <div class="orb-stage">
      <div class="ring r2"></div>
      <div class="ring r1"></div>
      <div class="orb" id="orb" onclick="falarComOrbe()"></div>
      <div class="orb-caption">
        <div class="state" id="orbState">Pronta</div>
        <div class="hint" id="orbHint">toca no orbe ou digita abaixo</div>
      </div>
    </div>

    <!-- Pílula de Escuta -->
    <div class="mic-pill">
      <div class="icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg>
      </div>
      <div class="t">
        <small id="statusEscutaRotulo">Escuta Contínua</small>
        <span id="statusEscutaTexto">Ativa — Nyore pronta para responder</span>
      </div>
      <div class="switch" id="switchMic" onclick="alternarEscuta()"></div>
    </div>

    <!-- ATALHOS FUNCIONAIS -->
    <div class="home-shortcuts">
      <div class="shortcut" onclick="acaoHistorico()" title="Histórico da Sessão">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>
      </div>
      <div class="shortcut" onclick="acaoVerBibliotecas()" title="Biblioteca de Conhecimento">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5V4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
      </div>
      <div class="shortcut" onclick="acaoLembretes()" title="Lembretes">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      </div>
      <div class="shortcut" onclick="acaoPesquisaDireta()" title="Pesquisar na Web">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      </div>
    </div>

    <!-- Caixa de Chat -->
    <div class="chat-box" id="chatBox"></div>

    <!-- Entrada de Texto com ID explícito no botão -->
    <div class="input-section">
      <textarea id="userInput" placeholder="Pergunta algo ou ensina com: ensinar [x] = [y]" onkeydown="checarEnter(event)"></textarea>
      <button class="btn-send" id="btnEnviarMsg" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>

    <div class="mem-footer">
      <span id="infoCategorias">Categorias: 0</span>
      <span id="infoItens">Itens Aprendidos: 0</span>
    </div>
  </div>
</div>

<script>
  // ELEMENTOS DA INTERFACE
  const orb = document.getElementById('orb');
  const orbState = document.getElementById('orbState');
  const orbHint = document.getElementById('orbHint');
  const chatBox = document.getElementById('chatBox');
  const userInput = document.getElementById('userInput');
  const btnEnviarMsg = document.getElementById('btnEnviarMsg');
  const saudacao = document.getElementById('saudacao');
  const relogio = document.getElementById('relogio');
  const infoCategorias = document.getElementById('infoCategorias');
  const infoItens = document.getElementById('infoItens');
  const switchMic = document.getElementById('switchMic');
  const statusEscutaTexto = document.getElementById('statusEscutaTexto');

  let escutaAtiva = true;

  // BASE DE DADOS LOCAL E CATEGORIAS
  let bibliotecas = JSON.parse(localStorage.getItem('nyore_bibliotecas')) || {
    "Gerais": {
      "olá": "Olá! Como posso ajudar nos teus estudos e tarefas hoje?",
      "quem és tu": "Sou a Nyore.IA, a tua assistente virtual angolana para aprendizagem, organização e pesquisas.",
      "tudo bem": "Tudo ótimo por aqui! Pronta para trabalhar."
    },
    "Informática de Gestão": {
      "o que é sistema de informação": "É um conjunto organizado de elementos (pessoas, dados, processos e tecnologia) que recolhe, processa, armazena e distribui informação para apoiar a tomada de decisões.",
      "o que é banco de dados": "É uma coleção organizada de dados estruturados, armazenados eletronicamente, permitindo acesso e consulta rápida.",
      "o que é erp": "ERP (Enterprise Resource Planning) é um software de gestão empresarial que integra todos os departamentos de uma empresa."
    },
    "Programação": {
      "o que é html": "HTML (HyperText Markup Language) é a linguagem de marcação padrão para criar e estruturar páginas na web.",
      "o que é python": "Python é uma linguagem de programação de alto nível, interpretada, de sintaxe simples e muito utilizada em IA e automação.",
      "o que é c sharp": "C# é uma linguagem de programação orientada a objetos desenvolvida pela Microsoft, muito usada para software desktop e jogos."
    },
    "Redes de Computadores": {
      "o que é endereço ip": "É um identificador numérico único atribuído a cada dispositivo ligado a uma rede de computadores.",
      "o que é router": "Um router é um dispositivo de rede que encaminha pacotes de dados entre diferentes redes de computadores."
    },
    "História e Geografia de Angola": {
      "quando foi a independência de angola": "Angola proclamou a sua independência a 11 de Novembro de 1975.",
      "qual é a capital de angola": "A capital de Angola é Luanda."
    }
  };

  let nomeUsuario = localStorage.getItem('nyore_nome_usuario') || "";
  let aguardandoNome = false;

  // REGISTO DIRETO DO EVENTO DE CLIQUE DO BOTÃO ENVIAR
  btnEnviarMsg.addEventListener('click', function(e) {
    e.preventDefault();
    processarMensagem();
  });

  // INICIALIZAÇÃO
  atualizarRelogio();
  setInterval(atualizarRelogio, 1000);
  atualizarContadores();
  iniciarSessao();

  function atualizarRelogio() {
    const agora = new Date();
    const h = String(agora.getHours()).padStart(2, '0');
    const m = String(agora.getMinutes()).padStart(2, '0');
    relogio.innerText = `${h}:${m}`;

    const hora = agora.getHours();
    if (hora >= 5 && hora < 12) saudacao.innerText = "Bom dia";
    else if (hora >= 12 && hora < 18) saudacao.innerText = "Boa tarde";
    else saudacao.innerText = "Boa noite";
  }

  function iniciarSessao() {
    if (!nomeUsuario) {
      aguardandoNome = true;
      adicionarMsgIA("Olá! Sou a Nyore.IA. Como gostaria que eu te chamasse?");
    } else {
      adicionarMsgIA(`Olá, ${nomeUsuario}! Como posso ajudar nos teus estudos hoje?`);
    }
  }

  function alternarEscuta() {
    escutaAtiva = !escutaAtiva;
    if (escutaAtiva) {
      switchMic.classList.remove('desligado');
      statusEscutaTexto.innerText = "Ativa — Nyore pronta para responder";
      definirEstado("Pronta", "falando", "escuta ativa");
    } else {
      switchMic.classList.add('desligado');
      statusEscutaTexto.innerText = "Pausada — Clique para reativar";
      definirEstado("Pausada", "inativo", "escuta desligada");
    }
  }

  function falarComOrbe() {
    if (!escutaAtiva) alternarEscuta();
    adicionarMsgSistema("Sintonia ativada. Podes digitar a tua pergunta abaixo!");
  }

  function acaoHistorico() {
    let totalMsgs = chatBox.children.length;
    adicionarMsgSistema(`<b>Histórico:</b> Esta sessão possui ${totalMsgs} interações registadas.`);
  }

  function acaoVerBibliotecas() {
    let relatorio = "<b>Bibliotecas Ativas na Memória:</b><br>";
    for (let cat in bibliotecas) {
      let qtd = Object.keys(bibliotecas[cat]).length;
      relatorio += `• <b>${cat}:</b> ${qtd} item(ns)<br>`;
    }
    adicionarMsgIA(relatorio);
  }

  function acaoLembretes() {
    adicionarMsgIA("<b>Lembretes Rápidos:</b><br>1. Rever matérias de prova<br>2. Adicionar novos ensinamentos com '='<br>3. Praticar exercícios de programação");
  }

  function acaoPesquisaDireta() {
    const texto = userInput.value.trim();
    if (!texto) {
      adicionarMsgSistema("Digita o assunto na caixa de texto e clica na Lupa para pesquisar na Web!");
      return;
    }
    processarMensagem(true);
  }

  function checarEnter(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      processarMensagem();
    }
  }

  function salvarBibliotecas() {
    localStorage.setItem('nyore_bibliotecas', JSON.stringify(bibliotecas));
    atualizarContadores();
  }

  function atualizarContadores() {
    let totalItens = 0;
    let totalCategorias = Object.keys(bibliotecas).length;
    for (let cat in bibliotecas) {
      totalItens += Object.keys(bibliotecas[cat]).length;
    }
    infoCategorias.innerText = `Categorias: ${totalCategorias}`;
    infoItens.innerText = `Itens Aprendidos: ${totalItens}`;
  }

  function normalizarTexto(texto) {
    return texto.toLowerCase().trim().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
  }

  function categorizarAutomatico(pergunta) {
    const p = pergunta.toLowerCase();
    if (p.includes("html") || p.includes("python") || p.includes("c#") || p.includes("código")) return "Programação";
    if (p.includes("ip") || p.includes("router") || p.includes("rede")) return "Redes de Computadores";
    if (p.includes("gestão") || p.includes("dados") || p.includes("erp")) return "Informática de Gestão";
    if (p.includes("angola") || p.includes("luanda") || p.includes("independência")) return "História e Geografia de Angola";
    return "Conhecimento Geral";
  }

  function adicionarMsgUser(msg) {
    chatBox.innerHTML += `<div class="msg msg-user">${msg.replace(/\n/g, '<br>')}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function adicionarMsgIA(msg) {
    chatBox.innerHTML += `<div class="msg msg-ia">${msg.replace(/\n/g, '<br>')}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function adicionarMsgSistema(msg) {
    chatBox.innerHTML += `<div class="msg msg-sistema">${msg}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function definirEstado(estado, orbeClasse, dica) {
    orbState.innerText = estado;
    orb.className = `orb ${orbeClasse}`;
    orbHint.innerText = dica;
  }

  async function processarMensagem(forcarWeb = false) {
    const textoOriginal = userInput.value.trim();
    if (!textoOriginal) return;

    adicionarMsgUser(textoOriginal);
    userInput.value = '';
    definirEstado("A processar...", "", "a analisar mensagem");

    if (aguardandoNome) {
      nomeUsuario = textoOriginal;
      localStorage.setItem('nyore_nome_usuario', nomeUsuario);
      aguardandoNome = false;
      setTimeout(() => {
        definirEstado("Pronta", "falando", "nome registado");
        adicionarMsgIA(`Prazer em conhecer-te, ${nomeUsuario}! A tua assistente está pronta.`);
      }, 400);
      return;
    }

    const chaveBusca = normalizarTexto(textoOriginal);

    // MODO ENSINAR
