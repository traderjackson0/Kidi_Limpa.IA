<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NYORE.IA</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-primary: #090c10;
            --bg-secondary: #131924;
            --bg-card: #1c2536;
            --accent-blue: #0088ff;
            --accent-cyan: #00d2ff;
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
            --border-color: #243047;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh; /* Preenche 100% da tela real no Android/Kodular */
            background-color: var(--bg-primary);
            color: var(--text-main);
            overflow: hidden;
        }

        /* CONTAINER PRINCIPAL RESPONSIVO */
        #app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* HEADERESTILO GEMINI */
        header {
            height: 56px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
        }

        .brand-title {
            color: var(--accent-cyan);
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* MENU LATERAL DESLIZANTE (DRAWER) */
        sidebar {
            position: absolute;
            top: 0;
            left: -280px; /* Escondido por padrão */
            width: 280px;
            height: 100%;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
            transition: left 0.3s ease-in-out;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }

        sidebar.open {
            left: 0; /* Desliza para fora ao clicar nos 3 pontinhos */
        }

        .overlay-menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 90;
            display: none;
        }

        .overlay-menu.active {
            display: block;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: left;
        }

        .nav-btn.active, .nav-btn:hover {
            background: var(--bg-card);
            color: var(--accent-cyan);
        }

        .history-section {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .history-item {
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-main);
            background: var(--bg-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 1px solid var(--border-color);
        }

        /* ÁREA DE CONTEÚDO E VIEWS */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: calc(100% - 56px);
            position: relative;
        }

        .view-panel {
            display: none;
            flex: 1;
            height: 100%;
            overflow: hidden;
        }

        .view-panel.active {
            display: flex;
            flex-direction: column;
        }

        /* VIEW: CHAT GEMINI STYLE */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user-msg {
            align-self: flex-end;
            background: var(--accent-blue);
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .bot-msg {
            align-self: flex-start;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-bottom-left-radius: 2px;
        }

        /* BARRA DE ENTRADA FIXA EM BAIXO */
        .input-bar {
            padding: 10px 12px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-bar input {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 10px 16px;
            color: white;
            outline: none;
            font-size: 0.95rem;
        }

        .input-bar button {
            padding: 10px 16px;
            background: var(--accent-blue);
            border: none;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        /* VIEW: CALCULADORA */
        .calc-wrapper {
            margin: auto;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 16px;
            width: 90%;
            max-width: 320px;
        }

        .calc-display {
            width: 100%;
            height: 48px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--accent-cyan);
            font-size: 1.4rem;
            text-align: right;
            padding: 8px;
            margin-bottom: 12px;
            outline: none;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .calc-btn {
            padding: 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }

        .calc-btn.op { color: var(--accent-cyan); }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- SOMBRA DO MENU -->
        <div id="overlayMenu" class="overlay-menu" onclick="toggleMenu()"></div>

        <!-- HEADER DA APP -->
        <header>
            <div class="header-left">
                <button class="menu-btn" onclick="toggleMenu()">
                    <i data-lucide="menu"></i>
                </button>
                <div class="brand-title">
                    <i data-lucide="bot"></i> NYORE.IA
                </div>
            </div>
            <div style="font-size: 0.8rem; color: var(--accent-cyan);">● Ativa</div>
        </header>

        <!-- MENU LATERAL (OCULTO/SLIDE) -->
        <sidebar id="sideMenu">
            <div class="brand-title" style="padding-bottom: 10px; border-bottom: 1px solid var(--border-color);">
                <i data-lucide="bot"></i> Painel Nyore
            </div>

            <div class="nav-menu">
                <button class="nav-btn active" onclick="mudarAba('chat', this)">
                    <i data-lucide="message-square"></i> Chat Principal
                </button>
                <button class="nav-btn" onclick="mudarAba('calc', this)">
                    <i data-lucide="calculator"></i> Calculadora
                </button>
            </div>

            <div class="history-section">
                <div class="history-title">Histórico Recente</div>
                <div id="history-list"></div>
            </div>

            <button class="nav-btn" style="color: var(--accent-blue);" onclick="novaConversa()">
                <i data-lucide="plus-circle"></i> Nova Conversa
            </button>
        </sidebar>

        <!-- ÁREA PRINCIPAL -->
        <main>
            <!-- CHAT VIEW -->
            <div id="view-chat" class="view-panel active">
                <div id="chat-container">
                    <div class="msg bot-msg">
                        Sistemas operacionais, Chefão! Cérebro ajustado e sem erros. O que queres ensinar ou consultar hoje?
                    </div>
                </div>
                <div class="input-bar">
                    <input type="text" id="chatInput" placeholder="Digita a tua mensagem..." onkeypress="handleKey(event)">
                    <button onclick="enviar()">ENVIAR</button>
                </div>
            </div>

            <!-- CALCULADORA VIEW -->
            <div id="view-calc" class="view-panel">
                <div class="calc-wrapper">
                    <input type="text" id="calcDisplay" class="calc-display" readonly>
                    <div class="calc-grid">
                        <button class="calc-btn" onclick="calcClear()">C</button>
                        <button class="calc-btn op" onclick="calcAppend('/')">/</button>
                        <button class="calc-btn op" onclick="calcAppend('*')">*</button>
                        <button class="calc-btn op" onclick="calcAppend('-')">-</button>
                        <button class="calc-btn" onclick="calcAppend('7')">7</button>
                        <button class="calc-btn" onclick="calcAppend('8')">8</button>
                        <button class="calc-btn" onclick="calcAppend('9')">9</button>
                        <button class="calc-btn op" onclick="calcAppend('+')">+</button>
                        <button class="calc-btn" onclick="calcAppend('4')">4</button>
                        <button class="calc-btn" onclick="calcAppend('5')">5</button>
                        <button class="calc-btn" onclick="calcAppend('6')">6</button>
                        <button class="calc-btn op" onclick="calcEval()">=</button>
                        <button class="calc-btn" onclick="calcAppend('1')">1</button>
                        <button class="calc-btn" onclick="calcAppend('2')">2</button>
                        <button class="calc-btn" onclick="calcAppend('3')">3</button>
                        <button class="calc-btn" onclick="calcAppend('0')">0</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        /* =========================================================
           CÉREBRO REPARADO DA NYORE.IA (MEMÓRIA x CONSULTA x ENSINO)
           ========================================================= */
        class CerebroNyore {
            constructor() {
                this.prefixoMemoria = "nyore_knowledge_";
            }

            // Normaliza o texto para busca sem erros
            limparTexto(str) {
                return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
            }

            // Ação de Guardar Conhecimento
            aprenderConhecimento(topico, conteudo) {
                const chave = this.limparTexto(topico);
                localStorage.setItem(this.prefixoMemoria + chave, conteudo);
                return `Anotado, Chefão! Guardei na minha memória tudo sobre **${topico.toUpperCase()}**.`;
            }

            // Ação de Buscar Conhecimento
            buscarConhecimento(topico) {
                const chave = this.limparTexto(topico);
                return localStorage.getItem(this.prefixoMemoria + chave);
            }

            // Processador Inteligente
            processar(texto) {
                if (!texto || !texto.trim()) return null;

                const raw = texto.trim();
                const t = this.limparTexto(raw);

                // === 1. MODO ENSINO / APRENDIZAGEM ===
                if (t.includes("aprende") || t.includes("guarda isto") || t.includes("aprende isto")) {
                    // Extrai o que está depois dos dois pontos ou da instrução
                    let partes = raw.split(":");
                    if (partes.length > 1) {
                        let topico = partes[0].replace(/(nyore|aprende|isto|que)/gi, "").trim();
                        let conteudo = partes.slice(1).join(":").trim();
                        return this.aprenderConhecimento(topico || "geral", conteudo);
                    }
                    
                    // Se enviou em formato direto com aspas ou texto corrido
                    if (t.includes("angola")) {
                        return this.aprenderConhecimento("angola", raw);
                    }

                    return "Recebido! Se quiseres ensinar um tópico específico, podes usar: **Nyore, aprende que [Tópico]: [Explicação]**.";
                }

                // === 2. MODO CONSULTA / PERGUNTAS ===
                if (t.includes("oque e") || t.includes("oq e") || t.includes("quem e") || t.includes("explica")) {
                    // Tenta identificar o assunto perguntado
                    let topico = t.replace(/(nyore|oque e|oq e|quem e|explica|\?)/g, "").trim();
                    let memória = this.buscarConhecimento(topico);

                    if (memória) {
                        return `📚 **Memória sobre ${topico.toUpperCase()}:**\n${memória}`;
                    } else {
                        return `Ainda não tenho o conceito de **${topico}** guardado na minha base, Chefão. Podes ensinar-me escrevendo: *"Nyore, aprende que ${topico}: [explicação]"*!`;
                    }
                }

                // === 3. SAUDAÇÕES E CONVERSA CORRENTE ===
                if (["ola", "oi", "viva", "nyore", "tudo bem"].some(g => t.includes(g))) {
                    return "Sistemas operacionais, Chefão! Em que posso ajudar a avançar agora?";
                }

                if (t.includes("obrigado") || t.includes("valeu")) {
                    return "Tamo junto, Chefão! Sempre às ordens.";
                }

                // Se perguntou algo genérico que não é saudação nem ensino
                let tentativaBusca = this.buscarConhecimento(t);
                if (tentativaBusca) {
                    return tentativaBusca;
                }

                return "Compreendido! Estou pronto para processar. Se quiseres que eu guarde este assunto na memória, avisa-me!";
            }
        }

        const cerebro = new CerebroNyore();

        window.onload = () => {
            lucide.createIcons();
        };

        /* =========================================================
           GERENCIADOR DE MENU E LAYOUT
           ========================================================= */
        function toggleMenu() {
            const sidebar = document.getElementById("sideMenu");
            const overlay = document.getElementById("overlayMenu");
            sidebar.classList.toggle("open");
            overlay.classList.toggle("active");
        }

        function mudarAba(aba, btn) {
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`view-${aba}`).classList.add('active');
            btn.classList.add('active');
            toggleMenu(); // Fecha o menu ao escolher a aba
        }

        /* =========================================================
           SISTEMA DE CHAT E HISTÓRICO
           ========================================================= */
        let historico = JSON.parse(localStorage.getItem("nyore_hist")) || [];

        function adicionarMensagem(autor, texto) {
            const container = document.getElementById("chat-container");
            const div = document.createElement("div");
            div.classList.add("msg", autor === "Tu" ? "user-msg" : "bot-msg");
            div.innerText = texto;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function enviar() {
            const input = document.getElementById("chatInput");
            const texto = input.value;
            if (!texto.trim()) return;

            adicionarMensagem("Tu", texto);
            input.value = "";

            // Atualiza histórico
            if (historico.length === 0 || historico[0] !== texto.substring(0, 20)) {
                historico.unshift(texto.substring(0, 22) + "...");
                localStorage.setItem("nyore_hist", JSON.stringify(historico));
                renderHistorico();
            }

            const resposta = cerebro.processar(texto);
            if (resposta) {
                setTimeout(() => adicionarMensagem("Nyore", resposta), 300);
            }
        }

        function handleKey(e) {
            if (e.key === 'Enter') enviar();
        }

        function renderHistorico() {
            const list = document.getElementById("history-list");
            list.innerHTML = "";
            historico.forEach(item => {
                const div = document.createElement("div");
                div.className = "history-item";
                div.innerText = item;
                list.appendChild(div);
            });
        }
        renderHistorico();

        function novaConversa() {
            document.getElementById("chat-container").innerHTML = `
                <div class="msg bot-msg">
                    Nova sessão aberta, Chefão! Cérebro pronto.
                </div>
            `;
            toggleMenu();
        }

        /* =========================================================
           CALCULADORA
           ========================================================= */
        function calcAppend(v) { document.getElementById('calcDisplay').value += v; }
        function calcClear() { document.getElementById('calcDisplay').value = ''; }
        function calcEval() {
            try { document.getElementById('calcDisplay').value = eval(document.getElementById('calcDisplay').value); }
            catch { document.getElementById('calcDisplay').value = 'Erro'; }
        }
    </script>
</body>
                            </html>
