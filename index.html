<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA Local Pro - Sistema de Bibliotecas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #0d0d14;
      color: #cdd6f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .widget-flutuante {
      width: 100%;
      max-width: 650px;
      height: 94vh;
      background: #161622;
      border-radius: 20px;
      padding: 15px;
      border: 1px solid #2a2a3d;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .status-orb {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, #7289da 0%, #161622 70%);
      margin-bottom: 10px;
      box-shadow: 0 0 20px #7289da;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .status-orb.pensando { background: radial-gradient(circle, #f1c40f 0%, #161622 70%); box-shadow: 0 0 25px #f1c40f; }
    .status-orb.aprendendo { background: radial-gradient(circle, #e67e22 0%, #161622 70%); box-shadow: 0 0 25px #e67e22; }
    .status-orb.falando { background: radial-gradient(circle, #2ecc71 0%, #161622 70%); box-shadow: 0 0 30px #2ecc71; }

    .chat-box {
      width: 100%;
      flex: 1;
      background: #0b0b12;
      border: 1px solid #28283a;
      border-radius: 15px;
      padding: 15px;
      overflow-y: auto;
      margin-bottom: 12px;
      font-size: 0.95em;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-user { color: #7289da; background: #1c1c2e; padding: 10px 14px; border-radius: 12px; align-self: flex-end; max-width: 85%; }
    .msg-ia { color: #2ecc71; background: #12221a; padding: 10px 14px; border-radius: 12px; align-self: flex-start; max-width: 85%; }
    .msg-sistema { color: #e67e22; background: #261c14; padding: 8px 12px; border-radius: 10px; align-self: center; font-style: italic; font-size: 0.88em; }

    .input-group { width: 100%; display: flex; gap: 8px; flex-shrink: 0; }

    textarea {
      flex: 1;
      background: #202030;
      border: 1px solid #3b3b54;
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      font-size: 0.95em;
      outline: none;
      resize: none;
      height: 50px;
      font-family: inherit;
    }

    .btn {
      background: #7289da;
      color: #fff;
      border: none;
      padding: 0 20px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .info-memoria {
      font-size: 0.75em;
      color: #888;
      margin-top: 6px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="widget-flutuante">
    <div id="orb" class="status-orb"></div>
    
    <div class="chat-box" id="chatBox"></div>

    <div class="input-group">
      <textarea id="userInput" placeholder="Escreve uma pergunta ou cole uma lista para me ensinar..." onkeydown="checarEnter(event)"></textarea>
      <button class="btn" onclick="processarMensagem()">Enviar</button>
    </div>

    <div class="info-memoria" id="infoMemoria">Bibliotecas ativas: 0 | Conhecimento salvo: 0</div>
  </div>

  <script>
    const orb = document.getElementById('orb');
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const infoMemoria = document.getElementById('infoMemoria');

    // Estrutura de Bibliotecas por Categoria
    let bibliotecas = JSON.parse(localStorage.getItem('ia_bibliotecas')) || {
      "Gerais": {
        "olá": "Olá! Como posso te ajudar hoje?",
        "tudo bem": "Tudo ótimo por aqui! E contigo?"
      },
      "Tecnologia": {
        "o que é html": "HTML é a linguagem de marcação usada para criar a estrutura das páginas e sites.",
        "o que é javascript": "JavaScript é a linguagem de programação usada para dar dinamismo e inteligência aos sites."
      },
      "Gírias": {
        "o que é kumbu": "Kumbu é dinheiro!",
        "o que é kota": "Kota é uma pessoa mais velha, respeitada ou com mais experiência."
      }
    };

    let nomeUsuario = localStorage.getItem('ia_nome_usuario') || "";
    let aguardandoNome = false;

    atualizarContadorMemoria();
    iniciarBoasVindas();

    function checarEnter(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        processarMensagem();
      }
    }

    function iniciarBoasVindas() {
      if (!nomeUsuario) {
        aguardandoNome = true;
        adicionarMsgIA("Olá! Sou a tua IA com sistema de bibliotecas inteligentes. Para começarmos, como gostaria que eu te chamasse?");
      } else {
        adicionarMsgIA(`Olá, ${nomeUsuario}! Em que posso te ajudar hoje? Podes me fazer perguntas ou colar uma lista inteira de conhecimentos!`);
      }
    }

    function salvarBibliotecas() {
      localStorage.setItem('ia_bibliotecas', JSON.stringify(bibliotecas));
      atualizarContadorMemoria();
    }

    function atualizarContadorMemoria() {
      let totalItens = 0;
      let totalCategorias = Object.keys(bibliotecas).length;
      for (let cat in bibliotecas) {
        totalItens += Object.keys(bibliotecas[cat]).length;
      }
      infoMemoria.innerText = `Bibliotecas ativas: ${totalCategorias} | Total de itens aprendidos: ${totalItens}`;
    }

    function normalizarTexto(texto) {
      return texto.toLowerCase().trim().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
    }

    function categorizarAutomatico(pergunta) {
      const p = pergunta.toLowerCase();
      if (p.includes("kumbu") || p.includes("kota") || p.includes("mboa") || p.includes("camba") || p.includes("bisno")) return "Gírias";
      if (p.includes("html") || p.includes("javascript") || p.includes("css") || p.includes("código") || p.includes("ia")) return "Tecnologia";
      if (p.includes("angola") || p.includes("luanda") || p.includes("província") || p.includes("rio") || p.includes("capital")) return "Geografia e História";
      return "Conhecimento Geral";
    }

    function adicionarMsgUser(msg) {
      chatBox.innerHTML += `<div class="msg-user"><b>Tu:</b> ${msg.replace(/\n/g, '<br>')}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function adicionarMsgIA(msg) {
      chatBox.innerHTML += `<div class="msg-ia"><b>IA:</b> ${msg}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function adicionarMsgSistema(msg) {
      chatBox.innerHTML += `<div class="msg-sistema">${msg}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function processarMensagem() {
      const textoOriginal = userInput.value.trim();
      if (!textoOriginal) return;

      adicionarMsgUser(textoOriginal);
      userInput.value = '';
      orb.className = 'status-orb pensando';

      // CAPTURA DO NOME DO UTILIZADOR
      if (aguardandoNome) {
        nomeUsuario = textoOriginal;
        localStorage.setItem('ia_nome_usuario', nomeUsuario);
        aguardandoNome = false;
        setTimeout(() => {
          adicionarMsgIA(`Perfeito, ${nomeUsuario}! Registei o teu nome. Agora podes conversar comigo ou colar várias frases para eu aprender de uma vez!`);
          orb.className = 'status-orb falando';
        }, 400);
        return;
      }

      const chaveBusca = normalizarTexto(textoOriginal);

      // RESPOSTAS VARIADAS AO NOME DO UTILIZADOR
      if (nomeUsuario && chaveBusca.includes(normalizarTexto(nomeUsuario))) {
        const respostasVariadas = [
          `Olá, ${nomeUsuario}! No que posso ajudar?`,
          `Diz lá, ${nomeUsuario}! Estou a ouvir.`,
          `Presente, ${nomeUsuario}! Qual é o mambo de hoje?`,
          `Fala comigo, ${nomeUsuario}! Pronta para processar novas informações.`
        ];
        const respostaSorteada = respostasVariadas[Math.floor(Math.random() * respostasVariadas.length)];
        setTimeout(() => {
          adicionarMsgIA(respostaSorteada);
          orb.className = 'status-orb falando';
        }, 400);
        return;
      }

      // APRENDIZADO EM MASSA OU FRASE ÚNICA
      if (textoOriginal.toLowerCase().includes("ensinar ") || textoOriginal.includes("=")) {
        let linhas = textoOriginal.split(/\n|;/); // Divide por quebra de linha ou ponto e vírgula
        let aprendidos = 0;

        linhas.forEach(linha => {
          let posEnsinar = linha.toLowerCase().indexOf("ensinar ");
          let textoTratado = posEnsinar !== -1 ? linha.substring(posEnsinar + 8) : linha;
          let partes = textoTratado.split("=");

          if (partes.length === 2) {
            let pergunta = normalizarTexto(partes[0]);
            let resposta = partes[1].trim();
            let categoria = categorizarAutomatico(pergunta);

            if (!bibliotecas[categoria]) bibliotecas[categoria] = {};
            bibliotecas[categoria][pergunta] = resposta;
            aprendidos++;
          }
        });

        if (aprendidos > 0) {
          salvarBibliotecas();
          setTimeout(() => {
            adicionarMsgSistema(`<b>IA (Aprendizado Concluído):</b> Processei e aprendi ${aprendidos} item(ns) novo(s) e organizei-os nas bibliotecas correspondentes!`);
            orb.className = 'status-orb falando';
          }, 500);
          return;
        }
      }

      // BUSCA OTIMIZADA POR BIBLIOTECAS E PALAVRAS-CHAVE
      setTimeout(() => {
        let resultado = buscarNasBibliotecas(chaveBusca);

        if (resultado) {
          adicionarMsgIA(resultado);
          orb.className = 'status-orb falando';
        } else {
          const aviso = `Ainda não tenho essa informação registrada nas minhas bibliotecas, ${nomeUsuario}. Podes colar a resposta usando: ensinar [pergunta] = [resposta]`;
          adicionarMsgSistema(aviso);
          orb.className = 'status-orb aprendendo';
        }
      }, 500);
    }

    function buscarNasBibliotecas(textoUsuario) {
      const palavrasUsuario = textoUsuario.split(" ").filter(p => p.length > 2);
      let melhorResposta = null;
      let maiorPontuacao = 0;

      // Percorre as bibliotecas organizadas
      for (let categoria in bibliotecas) {
        let banco = bibliotecas[categoria];

        for (let perguntaSalva in banco) {
          let pontuacao = 0;

          // Se a busca for exata
          if (textoUsuario === perguntaSalva) return banco[perguntaSalva];

          // Busca contextual por palavras
          palavrasUsuario.forEach(palavra => {
            if (perguntaSalva.includes(palavra)) {
              pontuacao += 2;
            }
          });

          if (pontuacao > maiorPontuacao && pontuacao >= 2) {
            maiorPontuacao = pontuacao;
            melhorResposta = banco[perguntaSalva];
          }
        }
      }

      return melhorResposta;
    }
  </script>
</body>
</html>
